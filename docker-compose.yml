services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ludo
      POSTGRES_USER: ludo
      POSTGRES_PASSWORD: ludo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ludo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludo -d ludo"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ludo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ludo_postgres:
  ludo_redis:
